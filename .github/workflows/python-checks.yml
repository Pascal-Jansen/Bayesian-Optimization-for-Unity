name: Python checks

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - maintenance
  workflow_dispatch:
  schedule:
    # Weekly full-stack run so botorch/torch API drift in the pinned
    # requirements is caught even though PR runs use lightweight stubs.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pytest

      - name: Check patch whitespace
        shell: bash
        run: |
          pathspecs=(
            "."
            ":(exclude)**/*.unity"
            ":(exclude)**/*.prefab"
            ":(exclude)**/*.asset"
            ":(exclude)**/*.meta"
          )
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" HEAD -- "${pathspecs[@]}"
          else
            git diff-tree --check --no-commit-id --root -r HEAD -- "${pathspecs[@]}"
          fi

      - name: Check generated Python caches are not tracked
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)__pycache__(/|$)|\.py[co]$|\.pyo$'; then
            echo "Generated Python cache artifacts must not be tracked."
            exit 1
          fi

      - name: Run Python unit tests
        run: python -m unittest discover tests

      - name: Run standalone bridge tests (transport only; optimiser tests need torch)
        run: python -m pytest docs/standalone-bridge -p no:cacheprovider -v

      - name: Check tests did not create Python caches
        shell: bash
        run: |
          cache_file="$(find . \( -type d -name __pycache__ -o -type f \( -name '*.pyc' -o -name '*.pyo' \) \) -print -quit)"
          if [[ -n "$cache_file" ]]; then
            echo "Generated Python cache artifact found: $cache_file"
            exit 1
          fi

  full-stack-tests:
    # Runs the complete suite against the real pinned dependency stack
    # (torch/botorch/moocore/scipy/sklearn), including the integration and
    # CABOP tests that are skipped in the lightweight job above. Weekly and
    # on manual dispatch only, because the stack download is large.
    name: Full-stack tests (real botorch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pinned dependency stack (CPU torch)
        shell: bash
        env:
          REQUIREMENTS: Assets/StreamingAssets/BOData/Installation/requirements.txt
          CPU_INDEX: https://download.pytorch.org/whl/cpu
        run: |
          python -m pip install --upgrade pip
          # Take the torch pin from requirements.txt, so a pin bump can never fall back to PyPI's
          # multi-GB CUDA build. The CPU index serves e.g. 2.14.1+cpu, which satisfies ==2.14.1.
          # (Inline comments stripped; "|| true" so a missing pin reaches the error below under bash -e -o pipefail.)
          torch_pin="$(sed -E 's/#.*$//' "$REQUIREMENTS" | grep -E '^[[:space:]]*torch[[:space:]]*==' | head -n 1 | tr -d '[:space:]' || true)"
          if [[ -z "$torch_pin" ]]; then
            echo "::error::No 'torch==<version>' pin found in $REQUIREMENTS."
            exit 1
          fi
          echo "Installing $torch_pin from the CPU index"
          python -m pip install "$torch_pin" --index-url "$CPU_INDEX"
          # Same options as PythonStarter on Linux: the CPU index stays available for torch.
          python -m pip install -r "$REQUIREMENTS" --extra-index-url "$CPU_INDEX"
          python -m pip install pytest
          python -m pip check
          python - "$torch_pin" <<'PY'
          import sys
          import torch
          pinned = sys.argv[1].split("==", 1)[1]
          installed = torch.__version__.split("+", 1)[0]
          assert installed == pinned, f"torch {torch.__version__} installed, requirements.txt pins {pinned}"
          assert torch.version.cuda is None, f"CUDA build of torch installed ({torch.__version__})"
          print(f"torch {torch.__version__} (CPU build) matches the pin {pinned}")
          PY

      - name: Run full test suite (integration + CABOP included)
        run: python -m unittest discover tests -v

      - name: Run DBO protocol check (real dbo.py over a socket)
        run: python tests/dbo_protocol_check.py

      - name: Run standalone bridge tests (real dbo_torch)
        run: python -m pytest docs/standalone-bridge -p no:cacheprovider -v

# Manually triggered release workflow.
#
# Usage:
#   1. Collect notes under "## [Unreleased]" in CHANGELOG.md while developing.
#   2. GitHub -> Actions -> "Release" -> "Run workflow" (from main), enter the
#      version (e.g. "2.0.0", "v2.0.0" or the pre-release "2.1.0-rc.1") and run.
#
# The workflow then:
#   - validates the version, runs the Python test suites and checks the engine copies of Backend/,
#   - moves the [Unreleased] changelog section under the new version heading,
#   - bumps the version in VERSION, CITATION.cff, Python/, the Unreal plugin (and its pre-release flag) and Unity
#     bundleVersion (tests/test_release_consistency.py checks that they agree),
#   - commits ("Release vX.Y.Z") and pushes these version files to main,
#   - builds the Unity and Unreal ZIP packages with tools/build_packages.py and creates a GitHub
#     release with them, using the changelog section as notes (auto-generated notes if it is empty);
#     versions with a suffix (-rc.N, -beta.N, -alpha.N) become pre-releases.
#
# The Unity .unitypackage needs a licensed Unity editor, which this workflow does not have: build it
# locally with `python tools/build_packages.py --version X --output DIR --unity-editor <Unity>` and
# upload it to the release.
#
# By default the release is a DRAFT: review it, then click "Publish release".
# Publishing creates the git tag and triggers the Zenodo archive/DOI.
# Note: the version-bump commit is pushed immediately, even for drafts.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 2.0.0, v2.0.0 or 2.1.0-rc.1)"
        required: true
        type: string
      draft:
        description: "Create as draft for review before publishing"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Test, version, and create release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release input
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RAW_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "main" && "$GITHUB_REF_NAME" != "master" ]]; then
            echo "::error::Releases must be created from the default branch (got '$GITHUB_REF_NAME')."
            exit 1
          fi

          version="${RAW_VERSION#v}"
          version="${version// /}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::Version '$RAW_VERSION' is not a semantic version (expected X.Y.Z or X.Y.Z-rc.N, -beta.N, -alpha.N)."
            exit 1
          fi

          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag '$tag' already exists."
            exit 1
          fi
          # Also catch existing DRAFT releases: drafts do not create the tag yet,
          # so the tag check alone would allow duplicate drafts on re-runs.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::A release (or draft) named '$tag' already exists. Publish or delete it first."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from $GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pytest jsonschema

      - name: Run Python tests and check the engine copies of Backend/
        run: |
          python -m unittest discover tests
          python -m pytest docs/standalone-bridge -p no:cacheprovider -q
          python tools/sync_backends.py --check
          python -m unittest discover -s Unreal/tests
          python -m unittest discover Python/tests

      - name: Roll changelog and bump the version
        id: versionfiles
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          today="$(date -u +%Y-%m-%d)"

          if [[ -f CHANGELOG.md ]] && grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            if grep -q "^## \[$VERSION\]" CHANGELOG.md; then
              echo "CHANGELOG.md already contains a [$VERSION] section; leaving it unchanged."
            else
              # Move the [Unreleased] content under the new version heading.
              sed -i "s/^## \[Unreleased\]$/## [Unreleased]\n\n## [$VERSION] - $today/" CHANGELOG.md
              echo "Rolled [Unreleased] into [$VERSION] - $today."
            fi
          else
            echo "::warning::CHANGELOG.md has no [Unreleased] section; skipping changelog roll."
          fi

          echo "$VERSION" > VERSION
          # Python packages write pre-releases as 2.1.0rc1 (PEP 440).
          pyversion="$(echo "$VERSION" | sed -E 's/-alpha\./a/; s/-beta\./b/; s/-rc\./rc/')"
          sed -i "s/^version = .*/version = \"$pyversion\"/" Python/pyproject.toml
          sed -i "s/^__version__ = .*/__version__ = \"$pyversion\"/" Python/interactive_bo/__init__.py
          sed -i "s/\"VersionName\": \"[^\"]*\"/\"VersionName\": \"$VERSION\"/" Unreal/Plugins/BayesianOptimization/BayesianOptimization.uplugin
          if [[ "$VERSION" == *-* ]]; then beta=true; else beta=false; fi
          sed -i "s/\"IsBetaVersion\": [a-z]*/\"IsBetaVersion\": $beta/" Unreal/Plugins/BayesianOptimization/BayesianOptimization.uplugin
          if [[ -f CITATION.cff ]]; then
            sed -i "s/^version: .*/version: \"$VERSION\"/" CITATION.cff
          fi
          if [[ -f Unity/ProjectSettings/ProjectSettings.asset ]]; then
            sed -i "s/^\(  bundleVersion: \).*/\1$VERSION/" Unity/ProjectSettings/ProjectSettings.asset
            grep '^  bundleVersion: ' Unity/ProjectSettings/ProjectSettings.asset
          else
            echo "::warning::Unity/ProjectSettings/ProjectSettings.asset not found; skipping bundleVersion bump."
          fi

          # Extract this version's changelog section for the release notes.
          if [[ -f CHANGELOG.md ]]; then
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
              /^## \[/ { flag = 0 }
              flag { print }
            ' CHANGELOG.md | sed -e '/./,$!d' > release_notes.md
          else
            : > release_notes.md
          fi

          if [[ -n "$(tr -d '[:space:]' < release_notes.md)" ]]; then
            echo "notes_source=changelog" >> "$GITHUB_OUTPUT"
          else
            echo "notes_source=generated" >> "$GITHUB_OUTPUT"
            echo "::warning::No changelog content for $VERSION; the release will use auto-generated notes."
          fi

      - name: Commit version files
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md VERSION CITATION.cff Python/pyproject.toml Python/interactive_bo/__init__.py Unreal/Plugins/BayesianOptimization/BayesianOptimization.uplugin Unity/ProjectSettings/ProjectSettings.asset 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No version file changes to commit."
          else
            git commit -m "Release $TAG"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Build engine packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python tools/build_packages.py --version "$VERSION" --output ReleaseArtifacts

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          DRAFT: ${{ inputs.draft }}
          NOTES_SOURCE: ${{ steps.versionfiles.outputs.notes_source }}
        run: |
          target="$(git rev-parse HEAD)"
          args=(--target "$target" --title "$TAG")
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          if [[ "$NOTES_SOURCE" == "changelog" ]]; then
            args+=(--notes-file release_notes.md)
          else
            args+=(--generate-notes)
          fi
          if [[ "$DRAFT" == "true" ]]; then
            args+=(--draft)
          fi
          url="$(gh release create "$TAG" "${args[@]}" ReleaseArtifacts/*)"
          echo "release_url=$url" >> "$GITHUB_ENV"

      - name: Write summary
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          DRAFT: ${{ inputs.draft }}
          NOTES_SOURCE: ${{ steps.versionfiles.outputs.notes_source }}
        run: |
          {
            echo "## Release $TAG"
            echo ""
            echo "- Release: $release_url"
            echo "- Notes source: $NOTES_SOURCE"
            if [[ "$DRAFT" == "true" ]]; then
              echo "- Created as **draft**: review/edit the notes, then click **Publish release**."
              echo "- Publishing creates the git tag and triggers the Zenodo archive/DOI."
            else
              echo "- Published immediately; the git tag was created and Zenodo will archive this release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

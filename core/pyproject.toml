[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "interactive-bo"
version = "0.1.0.dev0"
description = "Interactive Bayesian Optimization (IBO): human-in-the-loop Bayesian optimization for Unity, Unreal, the web and Python"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Pascal Jansen" }, { name = "Mark Colley" }]
keywords = ["bayesian optimization", "human-in-the-loop", "botorch", "user study", "hci"]
# The client is standard library only. The server's optimizer stack (torch, botorch, ...) is listed in
# Assets/StreamingAssets/BOData/Installation/requirements.txt until the backends move into this package.
dependencies = []

[project.urls]
Homepage = "https://github.com/Pascal-Jansen/Bayesian-Optimization-for-Unity"

[project.scripts]
ibo = "interactive_bo.__main__:main"

[tool.setuptools.packages.find]
include = ["interactive_bo*"]
